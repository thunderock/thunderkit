name: ci
"on":
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare isolated npm CLI
        run: |
          umask 077
          prefix="$(mktemp -d "$RUNNER_TEMP/npm-cli.XXXXXX")"
          cd "$RUNNER_TEMP"
          npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund --package-lock=false npm@11.19.1
          printf '%s\n' "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run all offline tests
        env:
          npm_config_offline: "true"
          npm_config_ignore_scripts: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
        run: make run_tests
      - name: Lint
        run: make lint
      - name: Leakage gate (no secrets / proprietary strings)
        run: |
          if grep -rniE 'adobe|astiwari|sensei-fs|AWS_BEARER|\.internal\b|\bcorp\.|firefly|\borion\b' \
             skills site bin README.md NORTH_STAR.md DEPENDENCIES.md .thunderkit; then
            echo "::error::leakage denylist hit"; exit 1
          fi
          echo "leakage gate clean"
      - name: Build site
        run: make site
