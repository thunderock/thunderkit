name: ci
"on":
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests (frontmatter + roster + drift)
        run: make run_tests
      - name: Lint
        run: make lint
      - name: Leakage gate (no secrets / proprietary strings)
        run: |
          if grep -rniE 'adobe|astiwari|sensei-fs|AWS_BEARER|\.internal\b|\bcorp\.|firefly|\borion\b' \
             skills site README.md NORTH_STAR.md; then
            echo "::error::leakage denylist hit"; exit 1
          fi
          echo "leakage gate clean"
      - name: Build site
        run: make site
