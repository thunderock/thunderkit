name: release-please
"on":
  push:
    branches: ["master"]

permissions:
  contents: write
  pull-requests: write
  id-token: write  # for the publish job (npm OIDC trusted publishing)

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          # Config + manifest live in the repo so the next version is computed
          # from Conventional Commits since the last tag — no manual bump.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish in the SAME run. A GitHub Release created with GITHUB_TOKEN never
  # triggers other workflows (`on: release` stays silent), so publishing must be
  # chained here rather than listening for the release event.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - name: Verify the pack contents (skills + bin, no repo noise)
        run: npm pack --dry-run
      - name: Publish to npm (OIDC trusted publishing, public)
        run: npm publish --provenance --access public
