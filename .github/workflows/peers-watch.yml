name: peers-watch
"on":
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Resolve each host's required peer channel
        run: |
          set -eu
          {
            echo "## Peer channels"
            for host in hermes opencode claude codex copilot; do
              node bin/thunderkit.js peers --host "$host"
            done
          } >> "$GITHUB_STEP_SUMMARY"
