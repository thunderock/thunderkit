name: publish
# Manual fallback only. Normal publishing happens in release-please.yml's `publish`
# job (a release created by GITHUB_TOKEN never fires `on: release`, so a separate
# release-triggered workflow would stay silent). Use this to re-publish a tag by hand.
"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true

permissions:
  contents: read
  id-token: write  # OIDC trusted publishing — no long-lived npm token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
